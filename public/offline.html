<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f59e0b">
    <title>You're offline — LudoVerse</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a; color: #f1f5f9;
            font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
            min-height: 100vh; display: flex; align-items: center; justify-content: center;
            padding: 24px; text-align: center;
        }
        .card { max-width: 420px; }
        .die {
            width: 96px; height: 96px; margin: 0 auto 24px;
            background: #f8fafc; border-radius: 22px; position: relative;
            border: 4px solid #f59e0b;
        }
        .die span {
            position: absolute; width: 14px; height: 14px; border-radius: 50%;
            background: #f59e0b;
        }
        h1 { font-size: 1.6rem; margin-bottom: 12px; color: #fbbf24; }
        p { color: #94a3b8; margin-bottom: 24px; line-height: 1.6; }
        button {
            min-height: 48px; padding: 12px 32px; font-size: 1rem; font-weight: 700;
            color: #0f172a; background: #f59e0b; border: none; border-radius: 12px;
            cursor: pointer;
        }
        button:active { transform: scale(0.97); }
    </style>
</head>
<body>
    <div class="card">
        <div class="die" aria-hidden="true">
            <span style="left:16px;top:16px"></span>
            <span style="left:16px;top:41px"></span>
            <span style="left:16px;top:66px"></span>
            <span style="left:41px;top:66px"></span>
            <span style="left:66px;top:66px"></span>
        </div>
        <h1>You're offline</h1>
        <p>LudoVerse needs a connection to roll the dice. Check your network and try again — your wallet and matches are safe.</p>
        <button onclick="location.reload()">Try again</button>
    </div>
</body>
</html>
